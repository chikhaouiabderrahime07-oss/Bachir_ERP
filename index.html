  <!-- SheetJS for Excel export — two CDN fallbacks -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    // If primary CDN failed, try unpkg
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://unpkg.com/xlsx@0.20.3/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
  <script>
    // Global Excel export helper — used everywhere in modules.js
    async function exportXLSX(headers, rows, filename) {
      if (typeof XLSX === 'undefined') {
        await Dialog.alert('Erreur', 'SheetJS non chargé. Vérifiez votre connexion internet et rechargez la page.', 'danger');
        return;
      }
      try {
        const wsData = [headers, ...rows];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        // Auto column widths
        const colWidths = headers.map((h, i) => {
          const maxLen = Math.max(
            String(h).length,
            ...rows.map(r => String(r[i] ?? '').length)
          );
          return { wch: Math.min(Math.max(maxLen + 2, 10), 50) };
        });
        ws['!cols'] = colWidths;
        // Style header row
        headers.forEach((_, i) => {
          const cell = ws[XLSX.utils.encode_cell({ r: 0, c: i })];
          if (cell) {
            cell.s = { font: { bold: true }, fill: { fgColor: { rgb: 'EBF0FB' } } };
          }
        });
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Export');
        XLSX.writeFile(wb, (filename || 'export') + '.xlsx');
      } catch(e) {
        console.error('exportXLSX error:', e);
        await Dialog.alert('Erreur', 'Erreur export Excel: ' + e.message, 'danger');
      }
    }
  </script>
</head>

<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('settings') || '{}');
    var logo = s.logoRight || s.rightLogo || s.logoLeft || s.leftLogo || '';
    var theme = s.themeMode || 'light';
    var splash = document.getElementById('splashScreen');

    // Apply theme immediately (no flash)
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme','dark');
      splash.style.background = '#0f172a';
    }

    // Show company logo if available
    if (logo) {
      var logoDiv = document.getElementById('splashCompanyLogo');
      logoDiv.innerHTML = '<img src="'+logo+'" style="max-height:72px;max-width:180px;border-radius:10px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.15))" alt="Logo"><div style="font-size:9px;letter-spacing:2px;color:#aaa;margin-top:8px;font-weight:600">'+(s.companyName||'')+'</div>';
      setTimeout(function(){ logoDiv.style.opacity = '1'; }, 100);
    }

    // Animate loading bar
    setTimeout(function(){
      var bar = document.getElementById('splashBar');
      if(bar) bar.style.width = '85%';
    }, 50);

  } catch(e){}

  // Hide splash after app loads
  window.addEventListener('load', function(){
    setTimeout(function(){
      var bar = document.getElementById('splashBar');
      if(bar) { bar.style.width='100%'; bar.style.transition='width .3s ease'; }
      setTimeout(function(){
        var sp = document.getElementById('splashScreen');
        if(sp){ sp.style.opacity='0'; sp.style.transform='scale(1.03)'; setTimeout(function(){sp.remove();},450); }
      }, 350);
    }, 700);
  });
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   APP BOOTSTRAP
══════════════════════════════════════════════════════════ */
const App = {
  _currentModule: null,
  _reloadTimer: null,

  init() {
    DB.init();

    // ── Prevent scroll from changing number input values (accidental changes) ──
    // Uses capture:true so it intercepts before the input handles it
    document.addEventListener('wheel', e => {
      if (document.activeElement?.type === 'number') {
        document.activeElement.blur();
      }
    }, { passive: true });

    // Apply saved lang
    const lang = localStorage.getItem('lang') || 'fr';
    T.set(lang);
    this._applyLangUI(lang);

    if (this._clockInterval) clearInterval(this._clockInterval);
    this._clockInterval = setInterval(() => this._tickClock(), 1000);
    this._tickClock();

    // Apply theme
    UI.applyTheme();

    // ── ALWAYS register event listeners first — before any early returns ──

    // Handle Login form submit
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const un = fd.get('username');
      const pw = fd.get('password');

      const btn = e.target.querySelector('button');
      const origText = btn.innerHTML;
      const errDiv = document.getElementById('loginError');
      errDiv.style.display = 'none';

      // Cloud mode
      if (typeof window.API !== 'undefined' && location.protocol !== 'file:') {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (T.isRTL() ? 'تسجيل الدخول...' : 'Connexion...');
        btn.disabled = true;

        API.login(un, pw).then(async res => {
          if (!res?.token) throw new Error(T.isRTL() ? 'فشل تسجيل الدخول' : 'Échec de connexion');
          btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> ' + (T.isRTL() ? 'مزامنة البيانات...' : 'Synchronisation...');
          try {
            await API.syncCloudToLocal();
            DB.runMigrations(); // backfill any caisse entries from synced BLs
            // Use the REAL user from the JWT — never do Auth.login() here (bcrypt vs plain)
            const realUser = res.user; // { id, name, username, role }
            localStorage.setItem('currentUser', JSON.stringify(realUser));
            if (realUser?.id) WorkLog.logIn(realUser.id);
            this._bootApp();
            this._checkMorningSession();
          } catch (syncErr) {
            console.error('Sync error:', syncErr);
            errDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + (syncErr.message || (T.isRTL() ? 'فشل المزامنة' : 'Erreur de synchronisation'));
            errDiv.style.display = 'block';
            btn.innerHTML = origText;
            btn.disabled = false;
          }
        }).catch(err => {
          errDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + (err.message || (T.isRTL() ? 'بيانات الاعتماد غير صالحة' : 'Identifiants invalides'));
          errDiv.style.display = 'block';
          btn.innerHTML = origText;
          btn.disabled = false;
        });
        return;
      }

      // Local / file:// mode
      const user = Auth.login(un, pw);
      if (user) {
        this._bootApp();
        this._checkMorningSession();
      } else {
        errDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + (T.isRTL() ? 'بيانات الاعتماد غير صالحة' : 'Identifiants invalides');
        errDiv.style.display = 'block';
      }
    });

    // Global ESC key
    document.addEventListener('keydown', e => { if (e.key === 'Escape') UI.closeModal(); });

    // Close user menu on outside click
    document.addEventListener('click', e => {
      if (!e.target.closest('#userMenuWrap')) document.getElementById('userDropdown')?.classList.remove('open');
    });

    // ── Now handle auth / boot ──────────────────────────────────────
    if (typeof window.API !== 'undefined' && location.protocol !== 'file:') {
      const hasToken = API.initFromToken();
      if (hasToken) {
        // Valid JWT — restore user from token and sync from cloud
        const apiUser = API.getUser();
        if (apiUser && !Auth.getCurrentUser()) {
          localStorage.setItem('currentUser', JSON.stringify(apiUser));
        }
        API.syncCloudToLocal().catch(() => {}).finally(() => {
          this._bootApp();
        });
      } else {
        // No valid token — show login screen
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
        this._updateLoginStrings();
      }
      return;
    }

    // Local mode (file://)
    if (Auth.isLoggedIn()) {
      this._bootApp();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
      this._updateLoginStrings();
    }
  },


  _tickClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const timeEl = document.getElementById('clockTime');
    const dateEl = document.getElementById('clockDate');
    if (timeEl) timeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    if (dateEl) dateEl.textContent = `${days[now.getDay()]} ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  },

  handleSessionBtnClick() {
    App.loadModule('caisse');
    setTimeout(() => {
      const s = SessionMgr.getTodaySession();
      if (s && s.status === 'closed' && typeof CaisseModule !== 'undefined') {
        CaisseModule.showCloture(true);
      }
    }, 150);
  },

  _bootApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    UI.applyTheme();
    this._applyBranding();
    this._updateTopbar();
    this.buildSidebar();
    UI.startClock();
    this.loadModule('dashboard');
    this._checkMorningSession();
    // Start live background sync so concurrent users see each other's changes
    DB.startLiveSync();
    // ── Recycle bin overflow notification (admin only) ──
    setTimeout(() => {
      if (Auth.isAdmin()) {
        const binCount = DB.getAll('recycle_bin').length;
        if (binCount >= 30) {
          Utils.notify(
            `🗑️ Corbeille : ${binCount} éléments — pensez à vider la corbeille !`,
            'warning', 8000
          );
        }
      }
    }, 2500);
    
    // ── Security: remove credentials from URL immediately after login ──
    if (location.search) {
      window.history.replaceState({}, document.title, location.pathname);
    }

    // ── Handle session expiry gracefully (no page reload = no password in URL) ──
    window.addEventListener('erp:session-expired', () => {
      Auth.logout(); // clears localStorage currentUser
      document.getElementById('appContainer').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      if (typeof Utils !== 'undefined') {
        Utils.notify('⏰ Session expirée — veuillez vous reconnecter', 'warning');
      }
    }, { once: false });

    // ── Handle concurrent login from another device / force logout ──
    window.addEventListener('erp:session-terminated', (e) => {
      Auth.logout();
      document.getElementById('appContainer').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      const msg = e.detail || (T.isRTL() ? 'تم تسجيل الدخول إلى هذا الحساب من جهاز آخر. تم إنهاء هذه الجلسة.' : 'Ce compte a été ouvert sur un autre appareil. Votre session a été fermée.');
      if (typeof Dialog !== 'undefined' && Dialog.alert) {
        Dialog.alert('⚠️ Session Déconnectée', msg, 'danger');
      } else if (typeof Utils !== 'undefined') {
        Utils.notify('⚠️ ' + msg, 'error', 8000);
      }
    }, { once: false });
  },

  _applyBranding() {
    const s = DB.getSettings();
    const name = s.companyName || 'Mon Entreprise';
    document.title = 'AI — ' + name;

    const logoLeft  = s.logoLeft  || s.leftLogo  || '';
    const logoRight = s.logoRight || s.rightLogo || '';
    // Use right logo for favicon (official company stamp), fallback to left
    const faviconLogo = logoRight || logoLeft;

    // ── Browser tab favicon ──────────────────────────────────────
    const favicon = document.getElementById('appFavicon');
    if (favicon && faviconLogo) {
      favicon.href = faviconLogo;
      favicon.type = faviconLogo.startsWith('data:image/png') ? 'image/png'
                   : faviconLogo.startsWith('data:image/svg') ? 'image/svg+xml'
                   : 'image/jpeg';
    }

    // Login screen — company branding footer
    const loginLogo = document.getElementById('loginLogoLeft');
    if (loginLogo) {
      if (logoLeft) { loginLogo.src = logoLeft; loginLogo.style.display = 'block'; }
      else { loginLogo.style.display = 'none'; }
    }
    const loginCompName = document.getElementById('loginCompanyName');
    if (loginCompName && name !== 'Mon Entreprise') {
      loginCompName.textContent = name;
    }

    // Login subtitle with company name
    const loginSub = document.getElementById('loginSubtitle');
    if (loginSub && name !== 'Mon Entreprise') {
      loginSub.textContent = name + ' — ' + (T.isRTL() ? 'وصول آمن' : 'Accès sécurisé');
    }

    // Topbar company badge (next to admin/user)
    const topCName = document.getElementById('topCompanyName');
    const topCLogo = document.getElementById('topCompanyLogo');
    if (topCName) topCName.textContent = name;
    if (topCLogo) {
      if (logoLeft) { topCLogo.src = logoLeft; topCLogo.style.display = 'block'; }
      else { topCLogo.style.display = 'none'; }
    }
  },


  _updateTopbar() {
    const u = Auth.getCurrentUser();
    if (!u) return;
    const avatar = document.getElementById('topAvatar');
    const uname = document.getElementById('topUserName');
    const ddName = document.getElementById('ddUserFullName');
    const ddRole = document.getElementById('ddUserRole');
    const sbFoot = document.getElementById('sbFooterUser');
    if (avatar) { avatar.textContent = u.name.charAt(0).toUpperCase(); avatar.className='avatar'+(u.role==='admin'?' admin-avatar':''); }
    if (uname) uname.textContent = u.name.split(' ')[0];
    if (ddName) ddName.textContent = u.name;
    if (ddRole) ddRole.textContent = T.get('role_'+u.role);
    if (sbFoot) sbFoot.textContent = u.name;
    document.getElementById('lblLogoutMenu').textContent = T.get('logout');
  },

  _updateLoginStrings() {
    const ids = {
      loginSubtitle:'login_sub', lblUsername:'username', lblPassword:'password',
      lblLoginBtn:'login', loginLangFR:'', loginLangAR:''
    };
    Object.entries(ids).forEach(([id, key]) => {
      if (!key) return;
      const el = document.getElementById(id);
      if (el) el.textContent = T.get(key);
    });
    const usernameInput = document.getElementById('loginUsername');
    if (usernameInput) usernameInput.placeholder = T.isRTL() ? 'المعرف' : 'Identifiant';
  },

  setLang(lang) {
    T.set(lang);
    this._applyLangUI(lang);
    if (Auth.isLoggedIn()) {
      this._updateTopbar();
      this.buildSidebar();
      if (this._currentModule) this.loadModule(this._currentModule);
    } else {
      this._updateLoginStrings();
    }
  },

  _applyLangUI(lang) {
    ['top','login'].forEach(prefix => {
      const fr = document.getElementById(`${prefix}LangFR`);
      const ar = document.getElementById(`${prefix}LangAR`);
      if (fr) fr.classList.toggle('active', lang==='fr');
      if (ar) ar.classList.toggle('active', lang==='ar');
    });
    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) themeBtn.title = lang === 'ar' ? 'السمة' : 'Thème';
  },

  buildSidebar() {
    const u = Auth.getCurrentUser();
    if (!u) return;
    const isAdmin = u.role === 'admin';
    const nav = document.getElementById('sidebarNav');
    if (!nav) return;

    const perms = Auth.myPermissions?.() || {};
    console.log('[DEBUG Sidebar]', { userId: u.id, role: u.role, isAdmin, perms: JSON.parse(JSON.stringify(perms)), canViewBLs: Auth.can('canViewBLs'), canViewBRs: Auth.can('canViewBRs'), rawUserPerms: u.permissions });
    const menu = [
      { section: T.get('sec_documents'), items: [
        { mod:'dashboard', icon:'fa-tachometer-alt', label:T.get('nav_dashboard') },
        ...(isAdmin || Auth.can('canViewBRs') ? [{ mod:'brs', icon:'fa-file-import', label:T.get('nav_brs') }] : []),
        ...(isAdmin || Auth.can('canViewBLs') ? [{ mod:'bls', icon:'fa-file-export', label:T.get('nav_bls') }] : []),
      ]},
      { section: T.get('sec_cash'), items: [
        ...(isAdmin
          ? [{ mod:'admin_caisse', icon:'fa-vault', label:T.get('nav_admin_caisse') }]
          : (Auth.can('canViewCaisse') ? [{ mod:'caisse', icon:'fa-cash-register', label:T.get('nav_caisse') }] : [])),
        ...(isAdmin || Auth.can('canViewBank') ? [{ mod:'bank', icon:'fa-university', label:'Banque' }] : []),
      ]},
      { section: T.get('sec_refs'), items: [
        ...(isAdmin || Auth.can('canViewSuppliers') || Auth.can('canViewClients') ? [{ mod:'partners', icon:'fa-handshake', label:'Fournisseurs & Clients' }] : []),
        ...(isAdmin || Auth.can('canViewCatalogue') ? [{ mod:'catalogue', icon:'fa-database', label:T.get('nav_catalogue')||'Catalogue' }] : []),
      ]},
      ...(isAdmin ? [{ section: T.get('sec_analysis'), items: [
        { mod:'stats',   icon:'fa-chart-bar',  label:T.get('nav_stats') },
        { mod:'eval',    icon:'fa-user-clock', label:T.get('nav_eval') },
      ]}] : []),
      ...(isAdmin ? [{ section: T.get('sec_admin'), items: [
        { mod:'audit',        icon:'fa-shield-alt',    label:T.get('nav_audit') },
        { mod:'recycle_bin',  icon:'fa-trash-restore', label:T.get('nav_recycle') },
        { mod:'settings',     icon:'fa-cog',           label:T.get('nav_settings') },
      ]}] : []),
    ];

    let html = '';
    menu.forEach(group => {
      html += `<div class="nav-section">${group.section}</div>`;
      group.items.forEach(item => {
        html += `<div class="nav-item" data-mod="${item.mod}">
          <div class="nav-icon"><i class="fas ${item.icon}"></i></div>
          <span class="nav-label">${item.label}</span>
        </div>`;
      });
    });
    nav.innerHTML = html;

    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        const mod = el.dataset.mod;
        nav.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        this.loadModule(mod);
        if (window.innerWidth < 768) {
          document.getElementById('sidebar')?.classList.remove('open');
          document.getElementById('sidebarOverlay')?.classList.remove('active');
        }
      });
    });

    this._setActiveSidebarItem(this._currentModule);
  },

  _setActiveSidebarItem(mod) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const el = document.querySelector(`.nav-item[data-mod="${mod}"]`);
    if (el) el.classList.add('active');
  },

  loadModule(mod) {
    const u = Auth.getCurrentUser();
    // Permission guard
    const modPerms = {brs:'canViewBRs', bls:'canViewBLs', caisse:'canViewCaisse', bank:'canViewBank', suppliers:'canViewSuppliers', clients:'canViewClients', partners:'canViewClients', stats:'canViewStats', catalogue:'canViewCatalogue'};
    if (u && u.role !== 'admin' && modPerms[mod] && !Auth.can(modPerms[mod])) {
      mod = 'dashboard';
      Utils.notify('Accès non autorisé', 'warning');
    }

    this._currentModule = mod;
    const main = document.getElementById('mainContent');
    const bc = document.getElementById('breadcrumb');

    const labels = {
      dashboard:'nav_dashboard', brs:'nav_brs', bls:'nav_bls', caisse:'nav_caisse',
      admin_caisse:'nav_admin_caisse', suppliers:'nav_suppliers', clients:'nav_clients', stats:'nav_stats',
      eval:'nav_eval', users:'nav_users', audit:'nav_audit', settings:'nav_settings',
      recycle_bin:'nav_recycle', partners:'Fournisseurs & Clients', bank:'Banque'
    };
    if (bc) bc.textContent = labels[mod]?.startsWith?.('nav_') ? T.get(labels[mod]) : (labels[mod]||mod);
    this._setActiveSidebarItem(mod);

    if (!main) return;

    // ── Preserve focused input state across re-renders (fixes search-loses-focus bug) ──
    const focused = document.activeElement;
    const savedFocusId    = focused?.id || null;
    const savedFocusValue = (focused?.tagName === 'INPUT' || focused?.tagName === 'TEXTAREA') ? focused.value : null;
    const savedSelStart   = focused?.selectionStart ?? null;
    const savedSelEnd     = focused?.selectionEnd   ?? null;

    try {
      let html = '';
      switch(mod) {
        case 'dashboard':    html = DashboardModule.render(); break;
        case 'brs':          html = BRModule.render(); break;
        case 'bls':          html = BLModule.render(); break;
        case 'caisse':       html = CaisseModule.render(); break;
        case 'admin_caisse': html = AdminCaisseModule.render(); break;
        case 'suppliers':    html = SuppliersModule.render(); break;
        case 'clients':      html = ClientsModule.render(); break;
        case 'partners':     html = PartnersModule.render(); break;
        case 'stats':        html = StatsModule.render(); break;
        case 'eval':         html = EvalModule.render(); break;
        case 'catalogue':    html = CatalogueModule.render(); break;
        case 'bank':         html = typeof BankModule !== 'undefined' ? BankModule.render() : ''; break;
        case 'users':        SettingsModule._tab='users'; html = SettingsModule.render(); break;
        case 'audit':        html = AuditModule.render(); break;
        case 'recycle_bin':  html = RecycleBinModule.render(); break;
        case 'settings':     html = SettingsModule.render(); break;
        default: html = `<div style="padding:40px;text-align:center;color:var(--text3)">${T.isRTL() ? 'الوحدة' : 'Module'} "${mod}" ${T.isRTL() ? 'غير موجودة' : 'introuvable'}</div>`;
      }
      main.innerHTML = html;
      main.scrollTop = 0;

      // ── Restore focus after re-render so search inputs keep focus ──
      if (savedFocusId) {
        const restored = document.getElementById(savedFocusId);
        if (restored && (restored.tagName === 'INPUT' || restored.tagName === 'TEXTAREA' || restored.tagName === 'SELECT')) {
          restored.focus();
          // Place cursor at end of text
          try {
            if (restored.value && restored.setSelectionRange) {
              const len = restored.value.length;
              restored.setSelectionRange(len, len);
            }
          } catch(e) { /* ignore for type=number/date */ }
        }
      }

      // Post-render hooks
      if (mod === 'stats' && typeof StatsModule !== 'undefined' && typeof StatsModule.initCharts === 'function') {
        setTimeout(() => StatsModule.initCharts(), 100);
      }
      if (mod === 'admin_caisse' && typeof AdminCaisseModule !== 'undefined' && typeof AdminCaisseModule.initCharts === 'function') {
        setTimeout(() => AdminCaisseModule.initCharts(), 100);
      }
      // Auto-load backups when settings data tab is open
      if (mod === 'settings' && typeof SettingsModule !== 'undefined' && SettingsModule._tab === 'data') {
        setTimeout(() => SettingsModule._loadBackups(), 200);
      }
      // Update session indicator
      this._updateSessionIndicator();
    } catch(e) {
      console.error('[App.loadModule]', mod, e);
      main.innerHTML = `<div style="padding:24px"><div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${T.isRTL() ? 'خطأ في الوحدة' : 'Erreur module'} <code>${mod}</code>: ${e.message}<br><pre style="font-size:10px;margin-top:8px;white-space:pre-wrap">${e.stack||''}</pre></div></div>`;
    }
  },


  _updateSessionIndicator() {
    const u = Auth.getCurrentUser();
    const indicator = document.getElementById('sessionIndicator');
    if (!indicator) return;
    if (!u || u.role === 'admin') { indicator.style.display = 'none'; return; }
    
    // Use SessionMgr method
    const session = typeof SessionMgr !== 'undefined' ? SessionMgr.getTodaySession(u.id) : null;
    if (!session) {
      indicator.style.display = 'none';
      return;
    }
    
    indicator.style.display = 'flex';
    const isClosed = session.status === 'closed';
    
    const dot = document.getElementById('sessionDot');
    const txt = document.getElementById('sessionActiveText');
    const btn = document.getElementById('closeSessionBtn');
    const btnSpan = btn.querySelector('span');
    const icon = document.getElementById('closeSessionIcon');
    
    if (isClosed) {
      dot.style.background = 'var(--danger)';
      txt.style.color = 'var(--danger)';
      txt.textContent = T.isRTL() ? 'اليوم مغلق' : 'Journée clôturée';
      btn.style.background = 'rgba(14,165,233,.12)';
      btn.style.color = 'var(--primary)';
      btn.style.borderColor = 'rgba(14,165,233,.3)';
      icon.className = 'fas fa-edit';
      btnSpan.textContent = T.isRTL() ? 'تعديل' : 'Modifier';
    } else {
      dot.style.background = 'var(--success)';
      txt.style.color = 'var(--success)';
      txt.textContent = T.isRTL() ? 'جلسة نشطة' : 'Session active';
      btn.style.background = 'rgba(239,68,68,.12)';
      btn.style.color = 'var(--danger)';
      btn.style.borderColor = 'rgba(239,68,68,.3)';
      icon.className = 'fas fa-door-closed';
      btnSpan.textContent = T.isRTL() ? 'إغلاق اليوم' : 'Clôturer journée';
    }
  },

  _updateCompanyInfo() {
    try {
      const s = DB.getSettings();
      const sbName = document.getElementById('sbBrandName');
      const sbImg  = document.getElementById('sbBrandImg');
      const sbIcon = document.getElementById('sbBrandIcon');
      // Update sidebar brand name
      if (sbName) sbName.textContent = s.companyName || 'ERP v2.0';
      // Sidebar: show logo or icon
      if (s.logoLeft && sbImg && sbIcon) {
        sbImg.src = s.logoLeft;
        sbImg.style.display = 'block';
        sbIcon.style.display = 'none';
      } else if (sbIcon) {
        sbIcon.style.display = 'flex';
        if (sbImg) sbImg.style.display = 'none';
      }
    } catch(e) { /* ignore */ }
  },

  reloadCurrent() { if (this._currentModule) this.loadModule(this._currentModule); },
  reloadDebounced(mod, delay=200) {
    clearTimeout(this._reloadTimer);
    this._reloadTimer = setTimeout(() => this.loadModule(mod||this._currentModule), delay);
  },

  _checkMorningSession() {
    const u = Auth.getCurrentUser();
    if (!u || u.role === 'admin') return;
    const existing = SessionMgr.getTodaySession(u.id);
    if (!existing) {
      // Small delay so app renders first
      setTimeout(() => {
        if (typeof CaisseModule !== 'undefined') CaisseModule.showMorningPrompt();
      }, 600);
    }
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>


<script>
let clickCount = 0;
function triggerCrazyAi() {
  clickCount++;
  const container = document.getElementById('aiLogoContainer');
  const img = document.getElementById('realAiLogo');
  const txt = document.getElementById('aiDynamicText');
  const sbImg = document.getElementById('sbRealLogo');
  const sbTxt = document.getElementById('sbAiText');

  if (!container || !img) return;

  // Reset animations
  img.style.animation = 'none';
  img.style.transform = 'none';
  img.style.filter = 'none';
  if(sbImg) { sbImg.style.animation = 'none'; sbImg.style.transform = 'none'; }
  void img.offsetWidth; // trigger reflow

  if (clickCount % 4 === 1) {
    // 1. Shrink and Spin
    img.style.transform = 'scale(0.3) rotate(720deg)';
    if(sbImg) sbImg.style.transform = 'scale(0.5) rotate(360deg)';
    if(txt) txt.innerText = "SHRINKING...";
    if(sbTxt) sbTxt.innerText = "MINI AI";
  } else if (clickCount % 4 === 2) {
    // 2. Rocket / Blast off
    img.style.transform = 'translateY(-150px) scale(0.5) rotate(45deg)';
    img.style.opacity = '0';
    if(txt) txt.innerText = "AI ROCKET LAUNCH 🚀";
    if(sbTxt) sbTxt.innerText = "LAUNCH";
    setTimeout(() => {
        img.style.transition = 'none';
        img.style.transform = 'translateY(150px)';
        setTimeout(() => {
            img.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
            img.style.transform = 'translateY(0) scale(1) rotate(0deg)';
            img.style.opacity = '1';
            if(txt) {
              txt.innerText = "A B D E R R A H I M E";
              txt.style.letterSpacing = "6px";
            }
            if(sbTxt) sbTxt.innerText = "ABDERRAHIME";
        }, 50);
    }, 500);
  } else if (clickCount % 4 === 3) {
    // 3. Shake & Change name to AI
    img.style.animation = 'crazyShake 0.5s infinite';
    if(sbImg) sbImg.style.animation = 'crazyShake 0.5s infinite';
    if(txt) {
      txt.innerText = "A I";
      txt.style.letterSpacing = "15px";
    }
    if(sbTxt) sbTxt.innerText = "AI";
  } else {
    // 4. Back to normal with glow
    img.style.transform = 'scale(1)';
    img.style.filter = 'drop-shadow(0 0 15px rgba(8, 145, 178, 0.8))';
    if(sbImg) sbImg.style.transform = 'scale(1)';
    if(txt) {
      txt.innerText = "ABDERRAHIME DEV";
      txt.style.letterSpacing = "2px";
    }
    if(sbTxt) sbTxt.innerText = "ABDERRAHIME";
  }
}
</script>
<style>
@keyframes crazyShake {
  0% { transform: translate(2px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-2deg); }
  20% { transform: translate(-3px, 0px) rotate(2deg); }
  30% { transform: translate(0px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(2deg); }
  50% { transform: translate(-1px, 2px) rotate(-2deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(2px, 1px) rotate(-2deg); }
  80% { transform: translate(-1px, -1px) rotate(2deg); }
  90% { transform: translate(2px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-2deg); }
}
</style>



<script>
// ═══ AI MEGA LOGO — 100 Effects Auto-Cycle Engine ═══
(function(){
  const TOTAL_FX = 100;
  let currentFx = 0;
  
  function applyFx(widget, n) {
    // Remove all fx classes
    for(let i=0;i<=TOTAL_FX;i++) widget.classList.remove('ai-fx-'+i);
    // Remove old state classes
    ['pulse','ball','name','search','explode','orbit','shrink'].forEach(s=>widget.classList.remove('ai-state-'+s));
    if(n>0) widget.classList.add('ai-fx-'+n);
  }
  
  // Auto-cycle every 5 seconds on login logo
  setInterval(()=>{
    const w = document.getElementById('loginAiWidget');
    if(!w || !w.offsetParent) return; // only if visible
    currentFx = (currentFx % TOTAL_FX) + 1;
    applyFx(w, currentFx);
  }, 5000);
  
  // Click = jump to random effect
  window.triggerAiAction = function(el) {
    const w = el.closest('.ai-widget') || el;
    const n = Math.floor(Math.random()*TOTAL_FX)+1;
    applyFx(w, n);
  };
})();
</script>
